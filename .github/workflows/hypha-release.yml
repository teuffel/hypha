name: Hypha Release

# Publishes a versioned Hypha production image to GHCR on every `v*` tag.
#
# This is the deliberate "cut a release" pipeline, distinct from hypha-build.yml
# (which build+smokes the image on every develop/master push but never pushes
# it anywhere). The flow here is: build → smoke the freshly built image → only
# then push, so the immutable vX.Y.Z tags stay trustworthy.
#
# Consumers pull `ghcr.io/<owner>/hypha:vX.Y.Z` and run it via
# docker-compose.hypha.prod.yml — no local CLJS build required.
#
# Requires no extra secrets: GHCR auth uses the workflow's GITHUB_TOKEN.
# After the first push, set the GHCR package visibility to Public once
# (Package settings → Danger Zone → Change visibility).

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Hypha uses a 4-segment version (e.g. v0.1.6.2, mirroring the phase
          # number) which is NOT valid semver, so type=semver can't parse it.
          # type=ref,event=tag uses the tag name verbatim → immutable vX.Y.Z.Z
          # pin. type=raw adds the mutable :latest pointer.
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          # Dynamic OCI labels layered on top of the static ones in
          # Dockerfile.hypha (version, revision=SHA, created timestamp).
          labels: |
            org.opencontainers.image.title=Hypha
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hypha
          platforms: linux/amd64
          load: true
          push: false
          # Tag the loaded image with the FIRST resolved tag so the smoke
          # step has a concrete reference to run.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the built image before publishing
        # Same shape as hypha-build.yml's container smoke: boot, /health,
        # access-code login. Runs against the locally loaded image so a broken
        # build can never reach an immutable published tag.
        env:
          # bcrypt hash of the dev code "dev" — CI-only, never a real secret.
          DEV_HASH: $2b$10$QsHRSpOlRo8R7Be1GspghOlxi5beCNAN2b2en9F7mezJZ253gNui2
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          mkdir -p ci-data
          chmod 777 ci-data
          docker run --rm -d --name hypha-release-smoke \
            -p 13000:3000 \
            -v "$(pwd)/ci-data:/data" \
            -e HYPHA_ACCESS_CODE_HASH="$DEV_HASH" \
            -e HYPHA_JWT_ISSUER=http://localhost:13000 \
            -e HYPHA_JWT_AUDIENCE=hypha-ci \
            "$IMAGE_REF"

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:13000/health > /dev/null; then
              echo "Ready after ${i}s"
              break
            fi
            sleep 1
          done

          curl -fs http://127.0.0.1:13000/health | grep -q '"status":"ok"'
          curl -fs -X POST http://127.0.0.1:13000/auth/login \
            -H 'content-type: application/json' \
            -d '{"code":"dev"}' | grep -q 'id-token'

          docker stop hypha-release-smoke

      - name: Push image to GHCR
        # Re-invokes build-push with push:true; the buildx gha cache from the
        # build step above makes this a near-instant re-export, not a rebuild.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hypha
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Hypha release `${{ github.ref_name }}` — self-hostable single-user fork of Logseq DB-flavor.

            ## Pull + run

            ```bash
            export HYPHA_VERSION=${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            # then, with .env prepared (see docs/hypha/self-hosting.md):
            docker compose -f docker-compose.hypha.prod.yml up -d
            ```

            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}` (linux/amd64)

            > **Logseq DB schema version in this release: `65.33`.**
            > If this number's MAJOR component differs from a previous release,
            > graphs will auto-migrate forward on first open and all devices must
            > run this version or newer to keep syncing. Back up `./data` before
            > upgrading. See docs/hypha/operations.md#upgrade.

            ---
            Auto-generated changelog below.
