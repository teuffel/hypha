# Hypha production-style deployment.
#
# Builds Dockerfile.hypha and runs the resulting image with a bind-mounted
# data directory (./data) where node-adapter persists SQLite + assets.
#
# Usage:
#   1. cp .env.example .env  and edit (HYPHA_ACCESS_CODE_HASH is required).
#   2. mkdir -p data
#   3. docker compose -f docker-compose.hypha.yml up --build
#
# See docs/hypha/operations.md for full operator instructions.

services:
  hypha:
    build:
      context: .
      dockerfile: Dockerfile.hypha
    image: hypha:latest
    init: true
    restart: unless-stopped
    ports:
      # Loopback only by default: put a TLS-terminating reverse proxy on the
      # same host in front. Set HYPHA_BIND=0.0.0.0 to expose the port on all
      # interfaces (LAN use; traffic is plain HTTP).
      - "${HYPHA_BIND:-127.0.0.1}:${HYPHA_HOST_PORT:-3000}:3000"
      # Plugin-assets origin. Third-party plugin iframes are served from
      # this second port so they are NOT same-origin with the app. The
      # browser must be able to reach it; see docs/hypha/operations.md.
      - "${HYPHA_BIND:-127.0.0.1}:${HYPHA_PLUGIN_HOST_PORT:-3010}:3010"
    volumes:
      # Bind-mount: data survives container removal. On host, ensure the
      # directory is owned by UID 1000 (the `node` user inside the image)
      # OR override `user:` to match host. The init step in operations.md
      # walks through this.
      - ./data:/data
    environment:
      # Required — fail-fast if unset. Generate with: bin/hypha-gen-access-hash
      HYPHA_ACCESS_CODE_HASH: ${HYPHA_ACCESS_CODE_HASH:?HYPHA_ACCESS_CODE_HASH must be set in .env}
      HYPHA_JWT_ISSUER: ${HYPHA_JWT_ISSUER:-http://localhost:3000}
      HYPHA_JWT_AUDIENCE: ${HYPHA_JWT_AUDIENCE:-hypha}
      # Secure session cookie. Unset: on when HYPHA_JWT_ISSUER is https://.
      # Set "false" only for plain-HTTP LAN access by IP or hostname.
      HYPHA_COOKIE_SECURE: ${HYPHA_COOKIE_SECURE:-}
      # Optional: extend the JWT lifetime, default 30d.
      HYPHA_JWT_TTL: ${HYPHA_JWT_TTL:-30d}
      # Plugin-assets origin (separate from the app origin — do not merge).
      # Port mode (default): the browser uses <app hostname>:<this port>.
      HYPHA_PLUGIN_PUBLIC_PORT: ${HYPHA_PLUGIN_HOST_PORT:-3010}
      # Reverse-proxy mode: full public origin on its own hostname, e.g.
      # https://plugins.hypha.example.com. Overrides the port when set.
      HYPHA_PLUGIN_ORIGIN: ${HYPHA_PLUGIN_ORIGIN:-}
      # Internal — keep at /data; the volume mount above is the persistence.
      HYPHA_DATA_DIR: /data
