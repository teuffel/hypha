# Hypha production-style deployment.
#
# Builds Dockerfile.hypha and runs the resulting image with a bind-mounted
# data directory (./data) where node-adapter persists SQLite + assets.
#
# Usage:
#   1. cp .env.example .env  and edit (HYPHA_ACCESS_CODE_HASH is required).
#   2. mkdir -p data
#   3. docker compose -f docker-compose.hypha.yml up --build
#
# See docs/hypha/operations.md for full operator instructions.

services:
  hypha:
    build:
      context: .
      dockerfile: Dockerfile.hypha
    image: hypha:latest
    init: true
    restart: unless-stopped
    ports:
      - "${HYPHA_HOST_PORT:-3000}:3000"
    volumes:
      # Bind-mount: data survives container removal. On host, ensure the
      # directory is owned by UID 1000 (the `node` user inside the image)
      # OR override `user:` to match host. The init step in operations.md
      # walks through this.
      - ./data:/data
    environment:
      # Required — fail-fast if unset. Generate with: bin/hypha-gen-access-hash
      HYPHA_ACCESS_CODE_HASH: ${HYPHA_ACCESS_CODE_HASH:?HYPHA_ACCESS_CODE_HASH must be set in .env}
      HYPHA_JWT_ISSUER: ${HYPHA_JWT_ISSUER:-http://localhost:3000}
      HYPHA_JWT_AUDIENCE: ${HYPHA_JWT_AUDIENCE:-hypha}
      # Secure cookie only over TLS. Set to "true" when behind https.
      HYPHA_COOKIE_SECURE: ${HYPHA_COOKIE_SECURE:-false}
      # Optional: extend the JWT lifetime, default 30d.
      HYPHA_JWT_TTL: ${HYPHA_JWT_TTL:-30d}
      # Internal — keep at /data; the volume mount above is the persistence.
      HYPHA_DATA_DIR: /data
