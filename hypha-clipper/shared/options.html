<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hypha Clipper options</title>
  <style>
    body { font: 13px system-ui, sans-serif; padding: 1rem; max-width: 32rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; padding: 0.4rem; margin-top: 0.25rem; box-sizing: border-box; }
    p.hint { color: #666; margin-top: 0.25rem; }
    button { margin-top: 1rem; padding: 0.4rem 1rem; }
    #status { margin-left: 0.75rem; }
  </style>
</head>
<body>
  <label for="host">Hypha server URL</label>
  <input id="host" type="url" placeholder="https://hypha.example.com">
  <p class="hint">The address you open Hypha at, without a trailing path.</p>

  <label for="accessCode">Access code</label>
  <input id="accessCode" type="password" placeholder="your instance access code">
  <p class="hint">Stored locally in this browser profile only.</p>

  <button id="save">Save</button><span id="status"></span>

  <script type="module" src="options.js"></script>
</body>
</html>
